name: Mobile MVP regression
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-mvp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mobile unit and UI contract tests
        working-directory: mobile
        run: npm test
      - name: Verify source tree for packaging
        working-directory: mobile
        run: npm run check:web
      - name: Package static mobile web entry
        working-directory: mobile
        run: npm run prepare:web
      - name: Verify packaged LNT gate and map
        run: |
          test -s mobile/www/index.html
          test -s mobile/www/catalog.html
          test -s mobile/www/map.html
          test -f mobile/www/data/catalog.json
          test -s mobile/www/src/lnt-gate.mjs
          test -s mobile/www/src/catalog.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {guardMapHtml} from './mobile/src/map-guard.mjs';
          const read = p => readFileSync(p, 'utf8');
          const entry = read('mobile/www/index.html');
          const map = read('mobile/www/map.html');
          const source = read('index.html');
          const catalog = read('mobile/www/catalog.html');
          assert.match(entry, /transitionGate/);
          assert.doesNotMatch(entry, /<iframe[^>]+src=/i);
          assert.match(map, /<script data-sanbakmap-lnt-map-guard>/);
          assert.ok(map.indexOf('data-sanbakmap-lnt-map-guard') < map.indexOf('<title'));
          assert.equal(map, guardMapHtml(source));
          assert.match(catalog, /normalizeCatalog/);
          assert.deepEqual(JSON.parse(read('mobile/www/data/catalog.json')), JSON.parse(read('mobile/catalog.json')));
          console.log('PASS: packaged LNT entry, guarded unmodified map, catalog and data');
          NODE
