<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>산박지도 · 탐색</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;background:#f3f7f4;color:#163b2a}header{background:#173d2d;color:white;padding:18px}h1{margin:0;font-size:1.4rem}main{padding:16px;max-width:700px;margin:auto}nav{display:flex;gap:7px;flex-wrap:wrap}button,input,select{font:inherit;padding:10px;border:1px solid #9cb6a4;border-radius:8px;min-height:44px;background:white}button[aria-pressed=true]{background:#215b42;color:white}label{display:block;margin-top:15px}input,select{display:block;width:100%}li,#detail{background:white;padding:14px;margin:10px 0;border-radius:10px}ul{padding:0;list-style:none}.note{font-size:.9rem;color:#526b5b}
</style></head><body><header><h1>산박지도</h1><div>산 · 섬 · 계곡 · 암벽 · 트레킹</div></header><main><p>전국 장소 탐색 · 이용 허용 여부는 관리기관 확인 전 미확인입니다.</p><nav id="categories" aria-label="장소 유형"></nav><label for="region">지역</label><select id="region"><option value="">전국</option></select><label for="search">이름 검색</label><input id="search" type="search" placeholder="장소 이름"><p id="count" role="status"></p><ul id="results"></ul><section id="detail" hidden aria-live="polite"></section><p><a href="./map.html">기존 산 지도 열기</a></p><p class="note">지도 선형은 현행 통행 허가를 의미하지 않습니다.</p></main><script>
// The catalog is an embedded view; a direct navigation must start at the LNT gate.
try {
  if (window.parent === window || !window.parent.document.body.classList.contains('unlocked')) {
    window.location.replace('./index.html');
  }
} catch (_) { window.location.replace('./index.html'); }
</script><script type="module">
import {CATEGORIES,normalizeCatalog,filterRecords,VALLEY_ACTIVITIES} from './src/catalog.mjs';
const $=id=>document.getElementById(id),labels={entry:'출입',swimming:'물놀이',cooking:'취사',camping:'야영'},states={unknown:'미확인',allowed:'허용',restricted:'제한',prohibited:'금지'};
let selected='mountain',records=[],loadError='',rejectedCount=0;
function show(r){const d=$('detail');d.replaceChildren();const h=document.createElement('h2');h.textContent=r.name;d.append(h);const p=document.createElement('p');p.textContent='지역: '+(r.region||'미확인')+' · 출처: '+(r.source||'미확인')+' · 확인일: '+(r.checkedAt||'미확인');d.append(p);if(r.category==='valley')for(const key of VALLEY_ACTIVITIES){const a=r.activity[key],p=document.createElement('p');p.textContent=labels[key]+': '+states[a.status]+' · 근거: '+(a.source||'미확인')+' · 확인일: '+(a.checkedAt||'미확인');d.append(p)}d.hidden=false}
function render(){const found=filterRecords(records,{category:selected,region:$('region').value,search:$('search').value});$('count').textContent=loadError||found.length+'곳'+(rejectedCount?' · 검증 실패 '+rejectedCount+'건 제외':'');$('results').replaceChildren();$('detail').hidden=true;if(!found.length){const li=document.createElement('li');li.textContent='검증된 장소 자료가 아직 없습니다.';$('results').append(li)}for(const r of found){const li=document.createElement('li'),b=document.createElement('button');b.textContent=r.name+' · '+(r.region||'지역 미확인');b.onclick=()=>show(r);li.append(b);$('results').append(li)}}
for(const c of CATEGORIES){const b=document.createElement('button');b.type='button';b.textContent=c.label;b.setAttribute('aria-pressed',String(c.id===selected));b.onclick=()=>{selected=c.id;for(const n of $('categories').children)n.setAttribute('aria-pressed',String(n===b));render()};$('categories').append(b)}
$('region').onchange=render;$('search').oninput=render;
try{const response=await fetch('./data/catalog.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data))throw Error('Invalid catalog');const normalized=normalizeCatalog(data);records=normalized.records;rejectedCount=normalized.rejected.length;if(rejectedCount)console.warn('Rejected invalid catalog rows',normalized.rejected);for(const region of [...new Set(records.map(r=>r.region).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'))){const o=document.createElement('option');o.value=region;o.textContent=region;$('region').append(o)}}catch(error){console.warn('Catalog load failed',error);loadError='자료 로딩 실패'}render();
</script></body></html>
