name: Deploy Sanbakmap to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate route topology and UI regressions
        run: |
          set -euo pipefail
          for file in tests/*.mjs; do node "$file"; done

      - name: Package website
        run: |
          set -euo pipefail
          for file in index.html national.html national_data.js national_routes.js ganwol-review.html ganwol-review-data.js ganwol-verify.js sw.js manifest.webmanifest icon-192.png icon-512.png .nojekyll; do
            test -f "$file"
          done
          grep -q '산박지도 v' index.html
          mkdir -p site
          cp index.html national.html national_data.js national_routes.js ganwol-review.html ganwol-review-data.js ganwol-verify.js sw.js manifest.webmanifest icon-192.png icon-512.png .nojekyll site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
