name: Deploy Sanbakmap to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate route topology and UI regressions
        run: |
          set -euo pipefail
          failed=0
          for file in tests/*.mjs; do
            if ! node "$file"; then
              echo "::error file=$file::Regression test failed"
              failed=1
            fi
          done
          if ! python -m py_compile tools/seorak-recover-v91.py; then
            echo "::error::Python source compilation failed"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::Some regression tests failed; refusing site deployment."
            exit 1
          fi

      - name: Package website
        run: |
          set -euo pipefail
          for file in index.html national.html national_data.js national_routes.js ganwol-review.html yeongnam-gpx-connect.html yeongnam-osm.html national-parks-trails.html national-parks-basemap.js seorak-v76-extra.js seorak-v77-extra.js seorak-v78-extra.js seorak-v83-gpx-tracks.js seorak-v95-pois.js seorak-v96-plan.js seorak-v78-extra.js yeongnam-course-v72.js ganwol-review-data.js ganwol-verify.js sw.js deployment-version.json manifest.webmanifest icon-192.png icon-512.png .nojekyll; do
            test -f "$file"
          done
          test -f core/trail-visibility.js
          test -f nationwide-full.html
          test "$(find data/nationwide-full -maxdepth 1 -name 'part-*.js' -type f | wc -l)" -eq 11
          test -f data/knps-seorak-2018.geojson
          for f in nationwide-official.html nationwide-topology.html core/nationwide-source-loader.js core/nationwide-app.js core/nationwide-topology-v102.js data/nationwide/index.json data/nationwide/bucket-00.json data/nationwide-topology/manifest.json; do test -f "$f"; done
          grep -q '산박지도 v' index.html
          mkdir -p site
          cp index.html national.html national_data.js national_routes.js ganwol-review.html yeongnam-gpx-connect.html yeongnam-osm.html national-parks-trails.html national-parks-basemap.js seorak-v76-extra.js seorak-v77-extra.js seorak-v78-extra.js seorak-v83-gpx-tracks.js seorak-v95-pois.js seorak-v96-plan.js yeongnam-course-v72.js ganwol-review-data.js ganwol-verify.js sw.js deployment-version.json manifest.webmanifest icon-192.png icon-512.png .nojekyll site/
          node tools/seorak-topology-v89.mjs --output-dir site
          node tools/seorak-topology-v92.mjs --output-dir site
          node tools/seorak-review-queue-v93.mjs --output-dir site
          node tools/seorak-poi-anchors-v94.mjs --output-dir site
          mkdir -p site/core site/data
          cp core/trail-visibility.js site/core/trail-visibility.js
          cp data/knps-seorak-2018.geojson site/data/knps-seorak-2018.geojson
          mkdir -p site/data/nationwide
          cp data/nationwide/*.json site/data/nationwide/
          node tools/rebuild-nationwide-shards.mjs --output-dir site/data/nationwide
          node tools/rebuild-topology-v102.mjs --output-dir site/data/nationwide-topology
          node tools/review-topology-v103.mjs --source-dir site/data/nationwide-topology --output-dir site/data/nationwide-topology
          test -f site/data/nationwide-topology/review-v103.json
          test "$(find site/data/nationwide-topology -maxdepth 1 -name 'bucket-*.json.gz' -type f | wc -l)" -eq 32
          node tools/knps-topology-v102.mjs --output-dir site/data
          test "$(find site/data/nationwide -maxdepth 1 -name 'bucket-*.json' -type f | wc -l)" -eq 32
          cp nationwide-official.html nationwide-topology.html site/
          cp nationwide-full.html site/nationwide-full.html
          mkdir -p site/data/nationwide-full
          cp data/nationwide-full/part-*.js site/data/nationwide-full/
          cp core/nationwide-source-loader.js core/nationwide-app.js core/nationwide-topology-v102.js core/nationwide-graph-review-v103.js site/core/
          cp audits/seorak-v90-original-node-review.json site/seorak-v90-original-node-review.json
          cp audits/seorak-v91-display-way-index.json site/seorak-v91-display-way-index.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
