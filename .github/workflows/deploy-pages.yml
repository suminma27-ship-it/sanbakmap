name: Deploy Sanbakmap to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate active mountain map MVP regressions
        run: |
          set -euo pipefail
          # Legacy route/topology tests remain in tests/ and in their separate workflow.
          # They are not release gates for the source-line-only mountain map MVP.
          for file in \
            tests/mountain-line-profile.mjs \
            tests/mountain-trails-leaflet-css.mjs \
            tests/mountain-trails-runtime.mjs \
            tests/mobile-gestures.mjs; do
            node "$file"
          done

      - name: Package source-line MVP and preserve legacy static pages
        run: |
          set -euo pipefail
          test -s mountain-trails.html
          test -s seorak-isolated-test.html
          test -s seorak-courses.html
          test -s data/seorak-predefined-routes.json
          test -s index.html
          test -s core/mountain-line-profile.js
          test -s core/nationwide-source-loader.js
          test -s vendor/leaflet.css
          test -s data/nationwide/index.json
          test -s data/nationwide-elevation/index.json
          test -s data/nationwide-elevation/online-v110.json
          test -s data/knps-seorak-2018.geojson
          mkdir -p site/core site/vendor site/data/nationwide site/data/nationwide-elevation
          cp index.html mountain-trails.html seorak-isolated-test.html seorak-courses.html site/
          cp core/mountain-line-profile.js core/nationwide-source-loader.js site/core/
          cp vendor/leaflet.css site/vendor/leaflet.css
          cp data/nationwide/*.json site/data/nationwide/
          cp data/nationwide-elevation/*.json site/data/nationwide-elevation/
          cp data/knps-seorak-2018.geojson data/seorak-predefined-routes.json site/data/
          # Retain existing static entry points and legacy assets without running topology builders.
          for file in national.html national_data.js national_routes.js nationwide-full.html nationwide-official.html nationwide-topology.html nationwide-plan.html national-parks-trails.html national-parks-basemap.js seorak-real-overlay.html seorak-standalone-s3.html ganwol-review.html yeongnam-gpx-connect.html yeongnam-osm.html seorak-v76-extra.js seorak-v77-extra.js seorak-v78-extra.js seorak-v83-gpx-tracks.js seorak-v95-pois.js seorak-v96-plan.js yeongnam-course-v72.js ganwol-review-data.js ganwol-verify.js sw.js deployment-version.json manifest.webmanifest icon-192.png icon-512.png .nojekyll; do
            if [ -f "$file" ]; then cp "$file" site/; fi
          done
          for dir in core data/nationwide-full data/nationwide-pois; do
            if [ -d "$dir" ]; then
              mkdir -p "site/$dir"
              cp -R "$dir"/. "site/$dir/"
            fi
          done
          # Only publish already committed source assets; no new contact, graph or DEM products.
          test -s site/mountain-trails.html
          test -s site/seorak-isolated-test.html
          test -s site/seorak-courses.html
          test -s site/data/seorak-predefined-routes.json
          test -s site/data/nationwide/index.json
          test -s site/data/nationwide-elevation/online-v110.json
          ! grep -q 'rebuild-topology-v102' <<< 'source-line-only'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
