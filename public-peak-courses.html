ame;const sub=document.createElement('small');sub.textContent=x.routeCount+'개 원본 구간 · 고도 '+x.profileCount+'개 · '+x.code;a.append(title,sub);$('results').append(a)}$('more').hidden=found.length<=limit;}$('search').oninput=()=>{limit=80;render()};$('more').onclick=()=>{limit+=80;render()};fetch('./data/public-peak-gpx/index.json?v=20261127-r19',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{if(d.schema!=='sanbak-public-peak-index-v1')throw Error('목록 형식 오류');items=Object.values(d.mountains).sort((a,b)=>a.name.localeCompare(b.name,'ko')||a.code.localeCompare(b.code));$('search').disabled=false;render()}).catch(e=>{$('count').textContent='공공 GPX 자료가 아직 배포되지 않았어. 기존 전국 산 목록은 이용할 수 있어. ('+e.message+')'})})();</script></body></html>
