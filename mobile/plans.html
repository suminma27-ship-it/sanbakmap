<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>산박지도 · 저장 코스</title><style>body{font:16px system-ui,sans-serif;max-width:720px;margin:auto;padding:20px;background:#f5f8f4;color:#173b2b}button,input{font:inherit;padding:10px;margin:5px;min-height:44px}li{padding:12px;margin:8px 0;background:white;border-radius:8px}small{display:block}#status{white-space:pre-wrap}</style></head><body style="visibility:hidden"><h1>저장한 코스</h1><p>모든 코스는 계획용이며 현재 통행 허가·실제 경로 연결은 확인되지 않았습니다. 지도 복원 시 원본과 연결망을 다시 검증해야 합니다.</p><button id="back">목록으로</button><button id="export">JSON 내보내기</button><label>JSON 가져오기 <input id="import" type="file" accept=".json,application/json"></label><p id="status" role="status"></p><ul id="plans"></ul><script>
try{if(window.parent===window||!window.parent.document.body.classList.contains('unlocked')||window.parent.document.getElementById('app')!==window.frameElement){location.replace('./index.html')}else{document.body.style.visibility='visible'}}catch(_){location.replace('./index.html')}
</script><script type="module">
import {readPlans,deletePlan,exportPlans,importPlans} from './src/plan-storage.mjs';
const $=id=>document.getElementById(id);
function status(s){$('status').textContent=s}
function render(){const list=$('plans');list.replaceChildren();try{const plans=readPlans(localStorage);if(!plans.length)status('저장한 코스가 없습니다.');for(const [index,p] of plans.entries()){const li=document.createElement('li'),title=document.createElement('strong');title.textContent=p.name;li.append(title);const details=document.createElement('small');details.textContent=[p.mountainCode,p.graphKind,p.planDate||'날짜 미정','경유지 '+p.waypoints.length+'개','경로 미검증'].join(' · ');li.append(details);const button=document.createElement('button');button.textContent='삭제';button.onclick=()=>{if(!confirm('이 코스를 삭제할까요?'))return;try{deletePlan(localStorage,index);status('삭제했습니다.');render()}catch(e){status(e.message)}};li.append(button);list.append(li)}}catch(e){status('저장 목록을 읽을 수 없습니다: '+e.message)}}
$('back').onclick=()=>{window.parent.document.getElementById('app').src='./catalog.html'};
$('export').onclick=()=>{try{const data=exportPlans(localStorage),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sanbakmap-plans.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('JSON 파일 내보내기를 요청했습니다.')}catch(e){status(e.message)}};
$('import').onchange=async event=>{const file=event.target.files?.[0];if(!file)return;try{if(file.size>200000)throw Error('파일 크기는 200KB 이하여야 합니다.');const result=importPlans(localStorage,await file.text());render();status('가져온 코스 '+result.imported+'개 · 중복 '+result.skipped+'개. 모든 경로는 재검증 필요.')}catch(e){status('가져오기 실패: '+e.message)}finally{event.target.value=''}};
render();
</script></body></html>
