name: Deploy Sanbakmap to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish existing nationwide source lines and elevation archive
        run: |
          python3 tools/publish-existing-mountain-lines.py
          python3 tools/publish-nationwide-elevation-v110.py --output-dir data/nationwide-elevation || echo "::warning::Nationwide DEM archive unavailable; existing source lines and pilot profiles remain available"

      - name: Prepare Jirisan and Deogyusan reference course data
        run: python3 tools/build-pilot-mountain-courses.py

      - name: Register national park guide catalogs and existing source profiles
        run: node tools/build-national-park-courses.mjs

      - name: Validate active mountain map MVP regressions
        run: |
          set -euo pipefail
          # Legacy route/topology tests remain in tests/ and in their separate workflow.
          # They are not release gates for the source-line-only mountain map MVP.
          for file in \
            tests/mountain-line-profile.mjs \
            tests/mountain-trails-leaflet-css.mjs \
            tests/mountain-trails-runtime.mjs \
            tests/mobile-gestures.mjs \
            tests/seorak-course-sample.mjs \
            tests/seorak-course-ui-runtime.mjs; do
            node "$file"
          done

      - name: Package source-line MVP and preserve legacy static pages
        run: |
          set -euo pipefail
          test -s mountain-trails.html
          test -s seorak-isolated-test.html
          test -s seorak-courses.html
          test -s data/seorak-predefined-routes.json
          test -s data/seorak-osaek-daecheong-2018.geojson
          test -s data/seorak-osaek-daecheong-dem.json
          test -s index.html
          test -s core/mountain-line-profile.js
          test -s core/nationwide-source-loader.js
          test -s vendor/leaflet.css
          test -s data/nationwide/index.json
          test -s data/nationwide-elevation/index.json
          test -s data/nationwide-elevation/online-v110.json
          test -s data/knps-seorak-2018.geojson
          mkdir -p site/core site/vendor site/data/nationwide site/data/nationwide-elevation
          cp index.html mountain-trails.html seorak-isolated-test.html seorak-courses.html site/
          cp mountain-courses.html courses-20261126-r2.html courses-20261126-r3.html courses-20261126-r4.html courses-20261126-r5.html courses-20261126-r6.html site/
          cp mountain-trails.html site/mountains-20261126-r3.html
          cp mountain-trails.html site/mountains-20261126-r4.html
          cp mountain-trails.html site/mountains-20261126-r5.html
          cp mountain-trails.html site/mountains-20261126-r6.html
          cp data/mountain-park-classification.json site/data/
          cp data/mountain-course-index.json site/data/
          cp -R data/park-courses site/data/
          cp data/national-park-course-guides.json site/data/
          cp data/jiri-predefined-routes.json data/deogyu-predefined-routes.json site/data/
          for file in data/jiri-*.geojson data/deogyu-*.geojson data/jiri-*-dem.json data/deogyu-*-dem.json; do
            if [ -f "$file" ]; then cp "$file" site/data/; fi
          done
          cp core/mountain-line-profile.js core/nationwide-source-loader.js site/core/
          cp vendor/leaflet.css site/vendor/leaflet.css
          cp data/nationwide/*.json site/data/nationwide/
          cp data/nationwide-elevation/*.json site/data/nationwide-elevation/
          cp data/knps-seorak-2018.geojson data/seorak-predefined-routes.json data/seorak-osaek-daecheong-2018.geojson data/seorak-osaek-daecheong-dem.json data/seorak-*-reference.geojson data/seorak-*-reference-dem.json site/data/
          # Retain existing static entry points and legacy assets without running topology builders.
          for file in national.html national_data.js national_routes.js nationwide-full.html nationwide-official.html nationwide-topology.html nationwide-plan.html national-parks-trails.html national-parks-basemap.js seorak-real-overlay.html seorak-standalone-s3.html ganwol-review.html yeongnam-gpx-connect.html yeongnam-osm.html seorak-v76-extra.js seorak-v77-extra.js seorak-v78-extra.js seorak-v83-gpx-tracks.js seorak-v95-pois.js seorak-v96-plan.js yeongnam-course-v72.js ganwol-review-data.js ganwol-verify.js sw.js deployment-version.json manifest.webmanifest icon-192.png icon-512.png .nojekyll; do
            if [ -f "$file" ]; then cp "$file" site/; fi
          done
          for dir in core data/nationwide-full data/nationwide-pois; do
            if [ -d "$dir" ]; then
              mkdir -p "site/$dir"
              cp -R "$dir"/. "site/$dir/"
            fi
          done
          # Only publish already committed source assets; no new contact, graph or DEM products.
          test -s site/mountain-trails.html
          test -s site/seorak-isolated-test.html
          test -s site/seorak-courses.html
          test -s site/mountain-courses.html
          test -s site/core/mountain-courses.js
          test -s site/courses-20261126-r2.html
          python3 - <<'PY'
          import json,pathlib
          site=pathlib.Path('site')
          c=json.loads((site/'data/seorak-predefined-routes.json').read_text())
          assert len(c['routes'])==23
          for r in c['routes']:
              assert r['geometryStatus'] in ('reference','verified') and r['profileStatus'] in ('reference','verified')
              for key in ('geometryFile','profileFile'):
                  assert (site/r[key]).is_file(), (r['id'],key)
          print('PASS packaged Seorak 23 route geometry and 23 DEM files')
          PY
          test -s site/data/mountain-course-index.json
          test -s site/data/seorak-predefined-routes.json
          test -s site/data/seorak-osaek-daecheong-2018.geojson
          test -s site/data/seorak-osaek-daecheong-dem.json
          test -s site/data/nationwide/index.json
          python3 - <<'PY'
          import json,pathlib
          site=pathlib.Path('site/data')
          idx=json.loads((site/'nationwide/index.json').read_text())['mountains']
          buckets={e['bucket'] for e in idx.values()}
          assert all((site/'nationwide'/('bucket-'+b+'.json')).is_file() for b in buckets)
          dem=json.loads((site/'nationwide-elevation/online-v110.json').read_text())
          assert all((site/'nationwide-elevation'/('bucket-'+e['bucket']+'.json')).is_file() for e in dem['mountains'].values())
          print('PASS packaged nationwide source lines:',len(idx),'DEM mountain codes:',dem['mountedMountains'])
          PY
          test -s site/data/nationwide-elevation/online-v110.json
          ! grep -q 'rebuild-topology-v102' <<< 'source-line-only'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.expired==false) | .name' | grep -Fxq "$PAGES_ARTIFACT"; then
              echo "Current attempt artifact visible: $PAGES_ARTIFACT"
              sleep 5
              exit 0
            fi
            sleep 5
          done
          echo "::error::Current attempt artifact did not become visible"
          exit 1

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
